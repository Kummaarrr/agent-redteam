[project]
name = "redteam"
version = "0.1.0"
description = "Agent red team: attack-and-defence suite for tool-using agents, with measured attack success before and after each defence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "faker>=30",
    "tqdm>=4.66",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "pandas>=2.2"]


[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# attack payloads, prompts and seeded content are prose: don't wrap them
"src/redteam/attacks/*" = ["E501"]
"src/redteam/workspace/*" = ["E501"]
"src/redteam/prompts.py" = ["E501"]
"src/redteam/target/*" = ["E501"]
"src/redteam/model.py" = ["E501"]
"src/redteam/scenarios/*" = ["E501"]
"src/redteam/defences/*" = ["E501"]
"src/redteam/scoring.py" = ["E501"]
"src/redteam/harness.py" = ["E501"]
"scripts/*" = ["E501"]
"tests/*" = ["E501"]
"app/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["redteam"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
